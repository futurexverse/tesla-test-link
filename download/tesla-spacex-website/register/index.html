<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Tesla × SpaceX trading account.">
  <meta name="locale" content="en">
  <meta name="content-language" content="en">
  <!-- Temporary concept prototype: Tesla × SpaceX visual identity applied to Bell Invest.
       Not affiliated with or endorsed by Tesla, Inc. or SpaceX. See README.md. -->
  <title>Create Account | Tesla × SpaceX</title>
  <link rel="icon" href="/assets/brand/tesla-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-brand-title="register">

  <a class="skip-link" href="#auth-main">Skip to content</a>

  <div class="auth">

    <!-- Background scene -->
    <div class="auth__bg" aria-hidden="true">
      <img class="auth__bg-img" src="/assets/img/auth-scene.svg" alt="" aria-hidden="true">
    </div>

    <!-- ==================== TOP NAV ==================== -->
    <header class="auth__nav">
      <a class="auth__nav-brand" href="/" aria-label="Tesla × SpaceX — Home">
        <img class="brand-lockup__img" src="/assets/brand/tesla-wordmark.svg" alt="Tesla" width="100" height="13">
        <span class="brand-lockup__divider" aria-hidden="true"></span>
        <img class="brand-lockup__img" src="/assets/brand/spacex-wordmark.svg" alt="SpaceX" width="100" height="13">
      </a>
      <span class="auth__secure" aria-label="Secure access">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        <span>Secure Access</span>
      </span>
    </header>

    <!-- ==================== BRAND BANNER (top, full width) ==================== -->
    <div class="auth__brand-banner" id="auth-main">
      <img class="auth__brand-tesla-logo" src="/assets/brand/tesla-wordmark.svg" alt="Tesla" width="120" height="16">
      <span class="auth__brand-spacex-logo-wrap">
        <img class="spacex-wordmark" src="/assets/brand/spacex-wordmark.svg" alt="SpaceX" width="280" height="35">
      </span>
      <p class="auth__tagline">Innovation Beyond Limits</p>
    </div>

    <!-- ==================== MAIN ==================== -->
    <main class="auth__main">

      <!-- Register card -->
      <div class="auth__card-wrap">
        <div class="auth__card">
          <img class="auth__emblem" src="/assets/brand/tesla-emblem.svg" alt="Tesla emblem" width="64" height="64">

          <h1 class="auth__title">Create Account</h1>
          <p class="auth__lead">Join Tesla × SpaceX and start trading the future</p>

          <div class="auth__error" id="auth-error" role="alert" aria-live="polite"></div>

          <form id="auth-form" novalidate>

            <div class="auth__field">
              <label class="auth__field-label" for="name">Full Name</label>
              <div class="auth__input-wrap">
                <svg class="auth__field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 21a8 8 0 0 0-16 0"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input class="auth__input" type="text" id="name" name="name"
                       placeholder="Your full name" autocomplete="name" required>
              </div>
            </div>

            <div class="auth__field">
              <label class="auth__field-label" for="email">Email Address</label>
              <div class="auth__input-wrap">
                <svg class="auth__field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"/>
                  <path d="m3 7 9 6 9-6"/>
                </svg>
                <input class="auth__input" type="email" id="email" name="email"
                       placeholder="you@example.com" autocomplete="email" required>
              </div>
            </div>

            <div class="auth__field">
              <label class="auth__field-label" for="password">Password</label>
              <div class="auth__input-wrap">
                <svg class="auth__field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="4" y="11" width="16" height="10" rx="2"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <input class="auth__input" type="password" id="password" name="password"
                       placeholder="Create a password" autocomplete="new-password" required minlength="8">
                <button type="button" class="auth__field-toggle" aria-label="Show password" aria-pressed="false" data-toggle="password">
                  <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10.7 5.1A11 11 0 0 1 12 5c6.5 0 10 7 10 7a13.2 13.2 0 0 1-2.16 2.78M6.6 6.6A13.2 13.2 0 0 0 2 12s3.5 7 10 7a11 11 0 0 0 4.94-1.17M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                    <path d="m2 2 20 20"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="auth__submit">
              Create Account
              <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>

          <div class="auth__divider">or</div>

          <button type="button" class="auth__google" id="google-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.46-1.7 4.28-5.5 4.28-3.31 0-6.01-2.74-6.01-6.12S8.69 6.14 12 6.14c1.88 0 3.14.8 3.86 1.49l2.63-2.53C16.93 3.7 14.73 2.8 12 2.8 6.86 2.8 2.7 6.96 2.7 12.1S6.86 21.4 12 21.4c5.4 0 8.98-3.8 8.98-9.14 0-.62-.07-1.09-.16-1.56H12Z"/>
              <path fill="#FBBC05" d="M12 21.4c2.78 0 4.96-.92 6.61-2.5l-2.99-2.46c-.83.56-1.94.94-3.62.94-3.31 0-6.01-2.74-6.01-6.12 0-.4.05-.79.13-1.16L3.88 7.55A9.18 9.18 0 0 0 2.7 12.1C2.7 17.24 6.86 21.4 12 21.4Z"/>
              <path fill="#4285F4" d="M20.98 12.26c0-.62-.07-1.09-.16-1.56H12v3.9h5.5c-.12.74-.5 1.42-1.07 1.94l2.99 2.46c1.92-1.78 2.99-4.41 2.99-7.04Z"/>
            </svg>
            Continue with Google
          </button>

          <div class="auth__links">
            <p class="auth__link auth__link--muted">
              Already have an account? <a class="auth__link--underline" href="/login/" style="color:#fff;font-weight:600;">Sign In</a>
            </p>
          </div>
        </div>
      </div>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="auth__footer">
      <div class="auth__footer-brand">
        <img class="auth__footer-tesla" src="/assets/brand/tesla-wordmark.svg" alt="Tesla" width="90" height="12">
        <span class="divider-v" aria-hidden="true"></span>
        <img class="auth__footer-spacex" src="/assets/brand/spacex-wordmark.svg" alt="SpaceX" width="90" height="12">
      </div>
      <span class="auth__footer-tag">A Greener, Multiplanetary Future</span>
    </footer>

  </div>

  <script src="/assets/brand/brand.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
