<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- Deep space gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="35%" stop-color="#06101c"/>
      <stop offset="65%" stop-color="#08182a"/>
      <stop offset="100%" stop-color="#0a2a4a"/>
    </linearGradient>

    <!-- Earth ocean (brighter blue, more saturated) -->
    <radialGradient id="earth" cx="0.15" cy="1.0" r="0.9">
      <stop offset="0%" stop-color="#3a9fde"/>
      <stop offset="20%" stop-color="#2a7fc4"/>
      <stop offset="42%" stop-color="#1a5f9e"/>
      <stop offset="62%" stop-color="#0e3f6e"/>
      <stop offset="80%" stop-color="#0a2440"/>
      <stop offset="100%" stop-color="#06121f"/>
    </radialGradient>

    <!-- Earth atmosphere limb (brighter cyan ring) -->
    <radialGradient id="atmo" cx="0.15" cy="1.0" r="0.9">
      <stop offset="0%" stop-color="#9fd8ff" stop-opacity="0"/>
      <stop offset="58%" stop-color="#9fd8ff" stop-opacity="0"/>
      <stop offset="62%" stop-color="#bfe6ff" stop-opacity="0.85"/>
      <stop offset="66%" stop-color="#7fc8ff" stop-opacity="0.45"/>
      <stop offset="78%" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon -->
    <radialGradient id="moonBody" cx="0.4" cy="0.38" r="0.7">
      <stop offset="0%" stop-color="#f0f2f5"/>
      <stop offset="55%" stop-color="#c4c9ce"/>
      <stop offset="85%" stop-color="#7a7f84"/>
      <stop offset="100%" stop-color="#3a3f45"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#cfd4d8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#cfd4d8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#cfd4d8" stop-opacity="0"/>
    </radialGradient>

    <!-- Plume core (bright) -->
    <radialGradient id="plumeCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fffce8" stop-opacity="1"/>
      <stop offset="20%" stop-color="#fff0b8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffb347" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#e8761f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8761f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="smoke" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#e8edf2" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#9aa0a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3a3f45" stop-opacity="0"/>
    </radialGradient>

    <!-- Rocket body gradient (stainless steel) -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3d42"/>
      <stop offset="20%" stop-color="#9aa0a6"/>
      <stop offset="45%" stop-color="#f4f6f8"/>
      <stop offset="60%" stop-color="#d8dde2"/>
      <stop offset="85%" stop-color="#6a6f74"/>
      <stop offset="100%" stop-color="#2a2d31"/>
    </linearGradient>

    <!-- Soft blur for distant objects -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="midBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="strongBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="1024" fill="url(#sky)"/>

  <!-- Starfield (denser) -->
  <g fill="#ffffff">
    <circle cx="40"   cy="40"  r="1.1" opacity="0.85"/>
    <circle cx="120"  cy="90"  r="0.9" opacity="0.6"/>
    <circle cx="200"  cy="30"  r="1.3" opacity="0.9"/>
    <circle cx="280"  cy="150" r="0.8" opacity="0.5"/>
    <circle cx="360"  cy="70"  r="1"   opacity="0.7"/>
    <circle cx="440"  cy="140" r="0.7" opacity="0.45"/>
    <circle cx="520"  cy="40"  r="1.2" opacity="0.8"/>
    <circle cx="610"  cy="120" r="0.9" opacity="0.55"/>
    <circle cx="700"  cy="60"  r="1"   opacity="0.7"/>
    <circle cx="790"  cy="30"  r="0.8" opacity="0.5"/>
    <circle cx="870"  cy="110" r="1.1" opacity="0.75"/>
    <circle cx="960"  cy="50"  r="0.7" opacity="0.4"/>
    <circle cx="1040" cy="140" r="1"   opacity="0.65"/>
    <circle cx="1120" cy="40"  r="0.9" opacity="0.55"/>
    <circle cx="1200" cy="130" r="1.2" opacity="0.8"/>
    <circle cx="1280" cy="70"  r="0.9" opacity="0.55"/>
    <circle cx="1360" cy="160" r="1.1" opacity="0.7"/>
    <circle cx="50"   cy="200" r="0.8" opacity="0.5"/>
    <circle cx="140"  cy="280" r="1"   opacity="0.65"/>
    <circle cx="260"  cy="240" r="0.7" opacity="0.4"/>
    <circle cx="450"  cy="220" r="1.1" opacity="0.7"/>
    <circle cx="620"  cy="280" r="0.9" opacity="0.55"/>
    <circle cx="860"  cy="200" r="1"   opacity="0.6"/>
    <circle cx="1060" cy="240" r="0.8" opacity="0.5"/>
    <circle cx="1260" cy="260" r="1.1" opacity="0.7"/>
    <circle cx="1340" cy="200" r="0.9" opacity="0.6"/>
    <circle cx="180"  cy="380" r="0.9" opacity="0.5"/>
    <circle cx="320"  cy="340" r="1.1" opacity="0.7"/>
    <circle cx="700"  cy="360" r="0.8" opacity="0.45"/>
    <circle cx="980"  cy="340" r="1"   opacity="0.6"/>
    <circle cx="1180" cy="380" r="0.9" opacity="0.55"/>
    <circle cx="80"   cy="450" r="0.8" opacity="0.4"/>
    <circle cx="400"  cy="430" r="1"   opacity="0.6"/>
    <circle cx="880"  cy="450" r="0.9" opacity="0.5"/>
    <circle cx="1300" cy="430" r="0.7" opacity="0.4"/>
    <circle cx="500"  cy="510" r="1"   opacity="0.55"/>
    <circle cx="1100" cy="520" r="0.8" opacity="0.45"/>
    <circle cx="240"  cy="560" r="0.9" opacity="0.5"/>
    <circle cx="760"  cy="560" r="1.1" opacity="0.6"/>
  </g>

  <!-- Moon (upper-right) with glow -->
  <circle cx="1230" cy="170" r="170" fill="url(#moonGlow)" filter="url(#midBlur)"/>
  <circle cx="1230" cy="170" r="74"  fill="url(#moonBody)"/>
  <g fill="#7a7f84" opacity="0.5">
    <circle cx="1205" cy="150" r="9"/>
    <circle cx="1248" cy="192" r="6"/>
    <circle cx="1220" cy="188" r="4"/>
    <circle cx="1258" cy="155" r="5"/>
    <circle cx="1192" cy="180" r="4"/>
    <circle cx="1242" cy="138" r="3.5"/>
  </g>

  <!-- ============ LAUNCH SCENE (center-right, lower half) ============ -->

  <!-- Big warm plume bloom (behind everything, very bright) -->
  <ellipse cx="640" cy="760" rx="340" ry="260" fill="url(#plumeCore)" filter="url(#strongBlur)" opacity="1"/>
  <ellipse cx="640" cy="780" rx="220" ry="160" fill="url(#plumeCore)" filter="url(#midBlur)" opacity="0.9"/>

  <!-- Billowing smoke clouds -->
  <ellipse cx="510" cy="780" rx="220" ry="120" fill="url(#smoke)" filter="url(#strongBlur)" opacity="0.85"/>
  <ellipse cx="770" cy="790" rx="240" ry="130" fill="url(#smoke)" filter="url(#strongBlur)" opacity="0.75"/>
  <ellipse cx="410" cy="820" rx="180" ry="80"  fill="url(#smoke)" filter="url(#midBlur)" opacity="0.7"/>
  <ellipse cx="890" cy="820" rx="200" ry="90"  fill="url(#smoke)" filter="url(#midBlur)" opacity="0.6"/>

  <!-- Earth horizon (bottom) — pulled up, bright blue -->
  <ellipse cx="100" cy="980" rx="1050" ry="340" fill="url(#earth)"/>
  <ellipse cx="100" cy="980" rx="1050" ry="340" fill="url(#atmo)"/>
  <!-- Cloud swirls on Earth -->
  <g fill="#ffffff" opacity="0.3" filter="url(#softBlur)">
    <ellipse cx="220" cy="800"  rx="180" ry="22"/>
    <ellipse cx="520" cy="840"  rx="240" ry="26"/>
    <ellipse cx="840" cy="820"  rx="200" ry="20"/>
    <ellipse cx="80"  cy="850"  rx="150" ry="18"/>
    <ellipse cx="1120" cy="840" rx="220" ry="24"/>
    <ellipse cx="370" cy="880"  rx="200" ry="22"/>
  </g>

  <!-- Launch tower (left of rocket, silhouetted lattice) -->
  <g stroke="#1a1d22" stroke-width="3" fill="none" opacity="0.9">
    <!-- Two vertical rails -->
    <line x1="450" y1="500" x2="450" y2="820"/>
    <line x1="500" y1="500" x2="500" y2="820"/>
    <!-- X cross-bracing -->
    <line x1="450" y1="520" x2="500" y2="560"/>
    <line x1="500" y1="520" x2="450" y2="560"/>
    <line x1="450" y1="560" x2="500" y2="600"/>
    <line x1="500" y1="560" x2="450" y2="600"/>
    <line x1="450" y1="600" x2="500" y2="640"/>
    <line x1="500" y1="600" x2="450" y2="640"/>
    <line x1="450" y1="640" x2="500" y2="680"/>
    <line x1="500" y1="640" x2="450" y2="680"/>
    <line x1="450" y1="680" x2="500" y2="720"/>
    <line x1="500" y1="680" x2="450" y2="720"/>
    <line x1="450" y1="720" x2="500" y2="760"/>
    <line x1="500" y1="720" x2="450" y2="760"/>
    <line x1="450" y1="760" x2="500" y2="800"/>
    <line x1="500" y1="760" x2="450" y2="800"/>
    <!-- Horizontal rungs -->
    <line x1="450" y1="520" x2="500" y2="520"/>
    <line x1="450" y1="560" x2="500" y2="560"/>
    <line x1="450" y1="600" x2="500" y2="600"/>
    <line x1="450" y1="640" x2="500" y2="640"/>
    <line x1="450" y1="680" x2="500" y2="680"/>
    <line x1="450" y1="720" x2="500" y2="720"/>
    <line x1="450" y1="760" x2="500" y2="760"/>
    <line x1="450" y1="800" x2="500" y2="800"/>
    <!-- Top platform -->
    <line x1="430" y1="500" x2="520" y2="500"/>
  </g>

  <!-- Rocket (center-right, tilted ~6°) — positioned to clear the brand text -->
  <g transform="translate(640 760) rotate(-6)">
    <!-- Bright exhaust flame (below rocket base) -->
    <path d="M -26 0 Q -14 80 -4 160 Q 0 200 4 160 Q 14 80 26 0 Q 20 -8 0 -8 Q -20 -8 -26 0 Z"
          fill="url(#plumeCore)" opacity="1"/>
    <path d="M -16 -4 Q -7 70 0 130 Q 7 70 16 -4 Q 12 -12 0 -12 Q -12 -12 -16 -4 Z"
          fill="#fffce8" opacity="0.95"/>
    <path d="M -8 -2 Q -3 40 0 90 Q 3 40 8 -2 Q 6 -8 0 -8 Q -6 -8 -8 -2 Z"
          fill="#ffffff" opacity="0.9"/>

    <!-- Rocket body (vertical cylinder) -->
    <rect x="-24" y="-470" width="48" height="470" fill="url(#steel)"/>

    <!-- Nose cone -->
    <path d="M -24 -470 Q 0 -525 24 -470 Z" fill="#1a1c1f"/>
    <!-- Small Tesla "T" emblem near nose -->
    <g transform="translate(0 -438)" fill="#0a0c0f">
      <rect x="-7" y="-2" width="14" height="3"/>
      <rect x="-2.5" y="0" width="5" height="14"/>
    </g>

    <!-- Grid fins (near top) -->
    <path d="M -24 -388 L -42 -380 L -42 -358 L -24 -354 Z" fill="#3a3d42"/>
    <path d="M  24 -388 L  42 -380 L  42 -358 L  24 -354 Z" fill="#3a3d42"/>

    <!-- "SPACEX" lettering down the fuselage -->
    <text x="0" y="-220" font-family="Arial, sans-serif" font-size="15" font-weight="700"
          letter-spacing="3" fill="#1a1c1f" text-anchor="middle"
          transform="rotate(90 0 -220)">SPACEX</text>

    <!-- Body banding lines -->
    <line x1="-24" y1="-470" x2="24" y2="-470" stroke="#1a1c1f" stroke-width="1.5" opacity="0.6"/>
    <line x1="-24" y1="-348" x2="24" y2="-348" stroke="#1a1c1f" stroke-width="1" opacity="0.4"/>
    <line x1="-24" y1="-120" x2="24" y2="-120" stroke="#1a1c1f" stroke-width="1" opacity="0.4"/>

    <!-- Engine skirt (bottom) -->
    <rect x="-24" y="-32" width="48" height="32" fill="#1a1c1f"/>
    <!-- Engine bells -->
    <ellipse cx="-13" cy="0" rx="8" ry="5" fill="#0a0c0f"/>
    <ellipse cx="0" cy="0" rx="8" ry="5" fill="#0a0c0f"/>
    <ellipse cx="13" cy="0" rx="8" ry="5" fill="#0a0c0f"/>

    <!-- Highlight stripe -->
    <rect x="-9" y="-470" width="3" height="470" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Additional ground smoke (in front of rocket base) -->
  <ellipse cx="640" cy="800" rx="280" ry="70" fill="url(#smoke)" filter="url(#strongBlur)" opacity="0.9"/>
  <ellipse cx="800" cy="810" rx="200" ry="55" fill="url(#smoke)" filter="url(#midBlur)" opacity="0.7"/>
  <ellipse cx="480" cy="810" rx="180" ry="50" fill="url(#smoke)" filter="url(#midBlur)" opacity="0.65"/>
</svg>
